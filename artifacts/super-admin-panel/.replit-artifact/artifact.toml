kind = "web"
previewPath = "/super-admin/"
title = "Super Admin Panel"
version = "1.0.0"
id = "artifacts/super-admin-panel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/super-admin/" ]
localPort = 18230

[services.development]
run = "pnpm --filter @workspace/super-admin-panel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/super-admin-panel", "run", "build" ]
publicDir = "artifacts/super-admin-panel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18230"
BASE_PATH = "/super-admin/"
