kind = "web"
previewPath = "/customer-web/"
title = "Customer Web - Join Queue"
version = "1.0.0"
id = "artifacts/customer-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/customer-web/" ]
localPort = 25962

[services.development]
run = "pnpm --filter @workspace/customer-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/customer-web", "run", "build" ]
publicDir = "artifacts/customer-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25962"
BASE_PATH = "/customer-web/"
